# Datadog Synthetic tests
#
# Synthetic tests check a running website from Datadog's servers. Datanique
# runs on your own PC, so there is nothing public for them to reach yet. This
# workflow is only useful once a Datanique instance is deployed where Datadog
# can reach it and you have created Synthetic tests for it in Datadog.
#
# Until then it only runs when started by hand (Actions > Datadog Synthetic
# tests > Run workflow), and it skips itself when the DD_API_KEY / DD_APP_KEY
# repository secrets are not set, so it never fails a push.
#
# Setup: https://docs.datadoghq.com/synthetics/cicd_integrations/github_actions/

name: Datadog Synthetic tests

on:
  workflow_dispatch:
    inputs:
      test_search_query:
        description: Datadog search query that selects the tests to run
        default: "tag:e2e-tests"
        required: true

permissions:
  contents: read

jobs:
  synthetics:
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
    steps:
      - name: Skip when the Datadog keys are not set
        if: env.DD_API_KEY == '' || env.DD_APP_KEY == ''
        run: echo "::notice::DD_API_KEY / DD_APP_KEY are not set, so the Datadog Synthetic tests were skipped."

      # Third-party action, pinned to the commit of release v4.1.1.
      - name: Run Datadog Synthetic tests
        if: env.DD_API_KEY != '' && env.DD_APP_KEY != ''
        uses: DataDog/synthetics-ci-github-action@7039855343386c30068a97ca381e68ea405e8539 # v4.1.1
        with:
          api-key: ${{ env.DD_API_KEY }}
          app-key: ${{ env.DD_APP_KEY }}
          test-search-query: ${{ inputs.test_search_query }}
