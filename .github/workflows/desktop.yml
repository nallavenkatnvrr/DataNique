# Portable Windows app
#
# Builds Datanique.exe (desktop_py/build-exe.bat) on Windows, runs its
# self-test and zips the app folder. No Python or Node.js is needed on the
# PC that runs it, only the WebView2 runtime that comes with Windows 10/11.
#
#   push to main, pull request   the zip is kept as a workflow artifact
#   version tag, published release   the zip and its .sha256 are attached
#                                    to the GitHub release
#
# The PostgreSQL / MySQL scanner and httpfs DuckDB extensions are downloaded
# here and packed into the app, so it works on PCs without internet access.

name: Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-app-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exe:
    runs-on: windows-latest
    permissions:
      contents: write # attach the zip to the release
    steps:
      # Publishing a release on GitHub also pushes its tag. That tag run has
      # nothing to do: the release run builds and attaches the zip.
      - name: Skip the tag run of a release made on GitHub
        id: skip
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { "skip=true" >> $env:GITHUB_OUTPUT; "The release run builds this one." }
          exit 0

      - uses: actions/checkout@v7
        if: steps.skip.outputs.skip != 'true'

      - uses: actions/setup-python@v7
        if: steps.skip.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v7
        if: steps.skip.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend
        if: steps.skip.outputs.skip != 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: DuckDB extensions for offline PCs
        if: steps.skip.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ver = (Select-String -Path backend/requirements.txt -Pattern '^duckdb==(\S+)').Matches[0].Groups[1].Value
          $dir = "backend/duckdb_extensions/v$ver/windows_amd64"
          New-Item -ItemType Directory -Force $dir | Out-Null
          foreach ($name in 'postgres_scanner', 'mysql_scanner', 'httpfs') {
            $gz = Join-Path $env:RUNNER_TEMP "$name.gz"
            Invoke-WebRequest "https://extensions.duckdb.org/v$ver/windows_amd64/$name.duckdb_extension.gz" -OutFile $gz
            $in = [IO.File]::OpenRead($gz)
            $unzip = [IO.Compression.GZipStream]::new($in, [IO.Compression.CompressionMode]::Decompress)
            $out = [IO.File]::Create((Join-Path $dir "$name.duckdb_extension"))
            $unzip.CopyTo($out)
            $out.Dispose(); $unzip.Dispose(); $in.Dispose()
          }
          Get-ChildItem $dir | Format-Table Name, Length

      - name: Build Datanique.exe and run its self-test
        if: steps.skip.outputs.skip != 'true'
        shell: cmd
        run: desktop_py\build-exe.bat

      - name: Checksum
        if: steps.skip.outputs.skip != 'true'
        id: zip
        shell: pwsh
        run: |
          $zip = Get-Item desktop_py/dist/*-windows-portable.zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $($zip.Name)" | Out-File -Encoding ascii "$($zip.FullName).sha256"
          "path=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "{0}  {1:N0} MB  sha256 {2}" -f $zip.Name, ($zip.Length / 1MB), $hash

      - uses: actions/upload-artifact@v7
        if: steps.skip.outputs.skip != 'true'
        with:
          name: Datanique-windows-portable
          path: |
            desktop_py/dist/*-windows-portable.zip
            desktop_py/dist/*-windows-portable.zip.sha256
          compression-level: 0 # already a zip
          retention-days: 14

      - name: Attach to the release
        if: steps.skip.outputs.skip != 'true' && (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          ZIP: ${{ steps.zip.outputs.path }}
        run: |
          # After a plain tag push the Release workflow creates the release; wait for it.
          for ($i = 0; $i -lt 60; $i++) {
            gh release view $env:TAG *> $null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 20
          }
          gh release upload $env:TAG $env:ZIP "$($env:ZIP).sha256" --clobber
